name: M0 Linux Feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - feature
    paths:
      - ".github/workflows/m0-linux-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: m0-linux-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-feasibility:
    name: Pinned Mihon Desktop Linux feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CANDIDATE_REPOSITORY: https://github.com/AltairCardinal/mihon-desktop.git
      CANDIDATE_SHA: 701080c251c8fd8b35d0b57a481d93b9a9eb3701
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check out exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git init candidate
          git -C candidate remote add origin "$CANDIDATE_REPOSITORY"
          git -C candidate fetch --depth=1 origin "$CANDIDATE_SHA"
          git -C candidate checkout --detach FETCH_HEAD
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          {
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$actual"
            echo "runner=$(uname -a)"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "python=$(python3 --version)"
            echo "gradle_wrapper=$(grep '^distributionUrl=' candidate/gradle/wrapper/gradle-wrapper.properties)"
          } | tee "$RUNNER_TEMP/m0-environment.txt"

      - name: Install Android SDK baseline required by shared Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager_path" ]; then
            echo "::error::Android SDK command-line tools are not installed in $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 127
          fi
          export PATH="$(dirname "$sdkmanager_path"):$ANDROID_HOME/platform-tools:$PATH"
          echo "Using sdkmanager: $sdkmanager_path"
          timeout --signal=TERM --kill-after=15s 8m sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python3 candidate/scripts/build-android.py check | tee "$RUNNER_TEMP/android-toolchain-check.json"

      - name: Verify wrapper and compile desktop JVM sources
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          timeout --signal=TERM --kill-after=30s 15m ./gradlew --no-daemon --console=plain --no-watch-fs --stacktrace :app-desktop:compileKotlinJvm

      - name: Prepare isolated Secret Service and virtual display
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 5m sudo apt-get update
          timeout --signal=TERM --kill-after=15s 5m sudo apt-get install --yes --no-install-recommends \
            gnome-keyring libsecret-tools dbus-x11 xvfb xauth xdotool
          command -v gnome-keyring-daemon
          command -v secret-tool
          command -v dbus-run-session

      - name: Run desktop JVM tests with isolated Secret Service
        id: desktop_tests
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m0-evidence"
          cat > "$RUNNER_TEMP/m0-fail-fast.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  failFast = true
              }
          }
          GRADLE
          set +e
          timeout --signal=TERM --kill-after=10s 10m             dbus-run-session -- bash -euo pipefail -c '
              printf "%s\\n" "nami-m0-ci-ephemeral-keyring" |
                gnome-keyring-daemon --unlock --components=secrets
              printf "%s\\n" "m0-probe-secret" |
                secret-tool store --label="NamiShelf M0 CI probe" service nami-m0-probe account runner
              actual="$(secret-tool lookup service nami-m0-probe account runner)"
              test "$actual" = "m0-probe-secret"
              secret-tool clear service nami-m0-probe account runner
              ./gradlew --no-daemon --console=plain --no-watch-fs --stacktrace                 -I "$RUNNER_TEMP/m0-fail-fast.init.gradle" :app-desktop:jvmTest
            ' > "$RUNNER_TEMP/m0-jvm-tests.log" 2>&1
          result=$?
          set -e
          echo "Desktop JVM test exit code: $result"
          tail -n 160 "$RUNNER_TEMP/m0-jvm-tests.log" || true
          exit "$result"

      - name: Launch unmodified desktop app in isolated X11 session
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -uo pipefail
          isolated="$RUNNER_TEMP/m0-isolated-home"
          mkdir -p "$isolated/home" "$isolated/config" "$isolated/data" "$isolated/cache"
          export HOME="$isolated/home"
          export XDG_CONFIG_HOME="$isolated/config"
          export XDG_DATA_HOME="$isolated/data"
          export XDG_CACHE_HOME="$isolated/cache"
          set +e
          dbus-run-session -- xvfb-run -a timeout --signal=TERM --kill-after=10s 60s \
            ./gradlew --no-daemon :app-desktop:run \
            > "$RUNNER_TEMP/m0-x11-launch.log" 2>&1
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/m0-x11-launch.exit-code"
          if [ "$result" -eq 124 ]; then
            echo "Application process remained alive for the 60-second smoke window."
          elif [ "$result" -eq 0 ]; then
            echo "Application task exited cleanly before the smoke window elapsed."
          else
            echo "Application launch failed with exit code $result."
            tail -n 120 "$RUNNER_TEMP/m0-x11-launch.log"
            exit "$result"
          fi

      - name: Generate desktop license metadata and dependency report
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m0-evidence"
          timeout --signal=TERM --kill-after=10s 5m ./gradlew --no-daemon --console=plain :app-desktop:exportLibraryDefinitionsJvm \
            > "$RUNNER_TEMP/m0-evidence/aboutlibraries-export.log" 2>&1 || true
          timeout --signal=TERM --kill-after=10s 5m ./gradlew --no-daemon --console=plain :app-desktop:dependencies --configuration jvmRuntimeClasspath \
            > "$RUNNER_TEMP/m0-evidence/desktop-runtime-dependencies.txt" 2>&1 || true
          cp -f app-desktop/build/reports/tests/jvmTest/index.html \
            "$RUNNER_TEMP/m0-evidence/desktop-jvm-test-report.html" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/m0-jvm-tests.log" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/m0-fail-fast.init.gradle" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/m0-environment.txt" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/android-toolchain-check.json" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/m0-x11-launch.log" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/m0-x11-launch.exit-code" "$RUNNER_TEMP/m0-evidence/" 2>/dev/null || true

      - name: Probe Linux native distribution task
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 5m ./gradlew --no-daemon --console=plain :app-desktop:createDistributable \
            > "$RUNNER_TEMP/m0-packaging-probe.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/m0-packaging-probe.exit-code"
          echo "Linux createDistributable exit code: $result"
          if [ "$result" -ne 0 ]; then
            echo "::warning::Linux native distribution task is unsupported or failed; inspect m0-packaging-probe.log and exit-code artifact."
          else
            echo "Linux native distribution task completed; inspect generated outputs before treating packaging as supported."
          fi
          # Deliberately non-gating evidence probe. The recorded Gradle exit code,
          # not this step's conclusion, is the packaging result.

      - name: Upload M0 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nami-shelf-m0-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m0-evidence/
            ${{ runner.temp }}/m0-packaging-probe.log
            ${{ runner.temp }}/m0-packaging-probe.exit-code
          if-no-files-found: warn
          retention-days: 30
